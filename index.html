<!DOCTYPE html>
<html lang="fr">

    <head>

       <meta charset="utf-8" />
       <title>Machine a Invocation</title>
       <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <form id="formulaire"> 
            <section class="container">
                <h2>Machine a Invocation</h2>
                <div class="inscription">
                    <label for="name">Veuiller ecrire votre Prénom :</label>
                    <input type="text" id="prenom" placeholder="Ex : Bob">
                </div>
                   <label for="soustext">Selectionner votre Pokémon</label>
                   <div class="pack">
                     <select id="creature">
                      <option class="option">- Choisie un compagnon -</option>
                        <option value="Lucario">Lucario</option>
                        <option value="Noctalie">Noctalie</option>
                        <option value="Ho-Oh">Ho-Oh</option>
                        <option value="Ronflex">Ronflex</option> 
                     </select>
                     <input type="submit" id="button" value="Lancer pokéball" ><img id="pokeball" src="Machine-a-invocation/images/pokepixel-removebg-preview.png">
                 </div>
                  
                 
            </section>
 </form>

            <section id="resultat" class="cache">
                <section class="partietwo">
                 <h1>Félicitation !! Tu as réussie !</h1>

                 <img class="zoneinvoc" src="" alt="Pokemon invoque">
                 <p id="message"></p>

                 <input type="click" id="recommencer" value="Renvoyer le Pokémon">
                </section>
            </section>

       <script src="script.js" defer></script>
    </body>
</html>
